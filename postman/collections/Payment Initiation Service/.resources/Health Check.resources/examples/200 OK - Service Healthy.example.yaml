$kind: http-example
name: 200 OK - Service Healthy
request:
  url: '{{baseUrl}}/api/v1/health'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "UP",
        "service": "Payment Initiation Service",
        "timestamp": "2026-03-27T22:13:04"
      }
order: 1000
