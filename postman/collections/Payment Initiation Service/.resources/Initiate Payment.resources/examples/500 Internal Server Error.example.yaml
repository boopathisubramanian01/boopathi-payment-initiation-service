$kind: http-example
name: 500 Internal Server Error
request:
  url: '{{baseUrl}}/api/v1/payments/initiate'
  method: POST
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "code": 500,
        "message": "Internal server error: Connection refused"
      }
order: 3000
