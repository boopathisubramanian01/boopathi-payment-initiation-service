spring.application.name=payment-initiation-service
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://admin:password@localhost:27017/payment_db?authSource=admin
spring.data.mongodb.database=payment_db

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.topic.pain001=payment.pain001.topic

# Logging
logging.level.root=INFO
logging.level.com.payment=DEBUG
